# MinIO backs the S3-compatible-store integration tests (e.g.
# TestS3MinIO in destination/destination_test.go): the connector must work
# against S3-compatible object stores, not just AWS S3 proper. Start it with
# `make test-integration-s3` (or `docker compose -f test/docker-compose.yml
# up -d --wait`) and stop it with `docker compose -f
# test/docker-compose.yml down`.
#
# The server runs with its default configuration (no MINIO_DOMAIN), so
# virtual-hosted requests are NOT supported: the connector must reach it
# through the aws.endpoint and aws.pathStyle configuration (the regression
# setup for ConduitIO/conduit-connector-s3#963). The test creates its bucket
# itself (via the AWS SDK, path-style, against localhost:9000) rather than a
# separate `mc mb` init container.
#
# MINIO_KMS_SECRET_KEY enables SSE-S3 (server-side encryption with S3-managed
# keys): the destination writer hardcodes ServerSideEncryption=AES256
# (destination/writer/s3.go, marked "TODO: config?"), and MinIO rejects
# SSE-S3 requests with a 501 unless a KMS key is configured. This is the
# standard MinIO dev configuration for SSE-S3.
services:
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: conduitminio
      MINIO_ROOT_PASSWORD: conduitminiosecret
      MINIO_KMS_SECRET_KEY: my-minio-key:OSMM+vkKUTCvQs9YL/CVMIMt43HFhkTiqZC7QkYYkYI=
    command: server /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
