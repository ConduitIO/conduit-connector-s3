name: test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'

      - name: Test
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-west-2
          AWS_S3_BUCKET: conduit-tests
        run: make test GOTEST_FLAGS="-v -count=1"

  minio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'

      - name: Start MinIO
        run: docker compose -f test/docker-compose.yml up -d --wait

      # MINIO_ENDPOINT, not AWS_ENDPOINT_URL: the AWS SDK reads AWS_ENDPOINT_URL
      # itself (aws-sdk-go-v2 config/env_config.go -> cfg.BaseEndpoint), so
      # setting it here would redirect the client to MinIO whether or not the
      # connector's own aws.endpoint configuration works -- the tests would
      # pass even with that plumbing deleted. MINIO_ENDPOINT only ever reaches
      # the connector through its config, so this job actually exercises it.
      # The tests fail if AWS_ENDPOINT_URL is set in the environment.
      #
      # Both packages run in a single invocation, mirroring
      # `make test-integration-s3`.
      - name: Test against MinIO
        env:
          AWS_ACCESS_KEY_ID: conduitminio
          AWS_SECRET_ACCESS_KEY: conduitminiosecret
          AWS_S3_BUCKET: conduit-s3-minio-test
          AWS_REGION: us-east-1
          MINIO_ENDPOINT: http://localhost:9000
        run: go test -race -count=1 -p 1 -run '^(TestS3MinIO.*|TestSource_MinIO|TestMinIO_.*)$' ./destination ./source

      - name: Stop MinIO
        if: always()
        run: docker compose -f test/docker-compose.yml down

  # SDK acceptance suite v2 against MinIO (#1035). It is the certification
  # bar: the report it writes (acceptance-report.json, uploaded as an
  # artifact) is what a registry entry at the Certified tier points to. A run
  # passes only if the test passes AND the report says finished and complete;
  # a missing report is a failed run.
  acceptance-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'

      - name: Start MinIO
        run: docker compose -f test/docker-compose.yml up -d --wait

      - name: Acceptance suite v2
        env:
          AWS_ACCESS_KEY_ID: conduitminio
          AWS_SECRET_ACCESS_KEY: conduitminiosecret
          AWS_REGION: us-east-1
          MINIO_ENDPOINT: http://localhost:9000
          CONDUIT_ACCEPTANCE_REPORT: ${{ github.workspace }}/acceptance-report.json
        run: |
          rm -f "$CONDUIT_ACCEPTANCE_REPORT"
          go test -race -count=1 -timeout 30m -run '^TestAcceptanceV2$' .

      - name: Check the report
        if: always()
        run: |
          test -f acceptance-report.json || { echo "no acceptance report written"; exit 1; }
          jq -e '.finished == true and .complete == true' acceptance-report.json >/dev/null || { echo "report is not finished and complete"; exit 1; }
          jq -r '.cases[] | "\(.id)\t\(.outcome)\t\(.skip_kind // "")\t\(.reason // "")"' acceptance-report.json | sort

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-report
          path: acceptance-report.json
          if-no-files-found: warn

      - name: Stop MinIO
        if: always()
        run: docker compose -f test/docker-compose.yml down -v
