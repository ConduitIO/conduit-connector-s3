name: test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Test
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-west-2
          AWS_S3_BUCKET: conduit-tests
        run: make test GOTEST_FLAGS="-v -count=1"

  minio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Start MinIO
        run: docker compose -f test/docker-compose.yml up -d --wait

      - name: Test against MinIO
        env:
          AWS_ACCESS_KEY_ID: conduitminio
          AWS_SECRET_ACCESS_KEY: conduitminiosecret
          AWS_S3_BUCKET: conduit-s3-minio-test
          AWS_REGION: us-east-1
          AWS_ENDPOINT_URL: http://localhost:9000
        run: go test -race -count=1 -run TestS3MinIO ./destination

      - name: Stop MinIO
        if: always()
        run: docker compose -f test/docker-compose.yml down
